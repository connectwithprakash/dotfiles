# AeroSpace tiling window manager config
# https://github.com/nikitabobko/AeroSpace

# --- Global tiling behavior ---
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'  # force left/right splits, not top/bottom

# --- App routing on window creation ---
# Workspace 1 is intentionally NOT routed to -- it's the general/default view
# (floating windows like System Settings, ad-hoc Safari tabs, anything not
# explicitly claimed below just lands there normally).
#
# Both Safari windows share bundle ID com.apple.Safari, so they can't be told
# apart by app-bundle-id. Safari Profiles DO prefix the window title with the
# profile name ("Work — <page title>", "Innovation Labs — <page title>"),
# which is stable across tab/page changes -- confirmed empirically against
# live window titles, so window-title-regex-substring is reliable here.
# NOTE: this key must stay above any [table] header below -- TOML attributes
# bare keys to whichever table header preceded them, not to indentation.
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = 'move-node-to-workspace 2' },
    { if = 'test %{window-title} ~= ^Innovation', run = 'move-node-to-workspace 2' },
    { if = 'test %{app-bundle-id} = md.obsidian', run = 'move-node-to-workspace 3' },
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace 4' },
]

# --- Workspace <-> monitor pinning ---
# Only workspace 2 is pinned (VS Code + Innovation Labs Safari, always on the
# external monitor). Workspaces 1, 3, 4 are intentionally NOT pinned -- each
# is a dedicated single-app "scene" you jump to with alt-3/4, and it should
# appear on whichever monitor is currently active, not a fixed screen.
[workspace-to-monitor-force-assignment]
    2 = 'secondary'  # external monitor -> workspace 2 (VS Code + paired Safari window)

# --- Keyboard shortcuts ---
[mode.main.binding]
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'  # Obsidian
    alt-4 = 'workspace 4'  # Slack
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-h = 'focus left'
    alt-l = 'focus right'
    alt-shift-h = 'move left'
    alt-shift-l = 'move right'
    alt-slash = 'layout tiles horizontal vertical'
    alt-shift-space = 'layout floating tiling'  # toggle a window out of tiling if it misbehaves
